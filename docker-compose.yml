services:
  tno_pipelines:
    image: tno_pipelines
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: "host"
    volumes:
      - .:/app
      # - ./data:/data
      - /home/glauber/linea/tno/data:/data

    # command: /bin/sh -c "while sleep 1000; do :; done"
    command: /bin/bash --login -c ". /app/env.sh && /app/predict_occultation/local.sh"
    environment:
      WORKER_NAME: worker_runner_1

